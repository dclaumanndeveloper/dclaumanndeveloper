<svg width="1200" height="252" viewBox="0 0 1200 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation of AI/ML Python code being typed">
  <defs>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="1200" height="252" rx="10"/>
    </clipPath>

    <clipPath id="clip0"><rect x="64" y="46" width="0" height="26"><animate attributeName="width" values="0;0;234;234;0" keyTimes="0;0.027;0.093;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip1"><rect x="64" y="76" width="0" height="26"><animate attributeName="width" values="0;0;423;423;0" keyTimes="0;0.111;0.230;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="64" y="106" width="0" height="26"><animate attributeName="width" values="0;0;432;432;0" keyTimes="0;0.248;0.369;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="64" y="136" width="0" height="26"><animate attributeName="width" values="0;0;18;18;0" keyTimes="0;0.387;0.393;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="64" y="166" width="0" height="26"><animate attributeName="width" values="0;0;594;594;0" keyTimes="0;0.411;0.577;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip5"><rect x="64" y="196" width="0" height="26"><animate attributeName="width" values="0;0;342;342;0" keyTimes="0;0.595;0.692;0.919;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect x="0" y="0" width="1200" height="252" fill="#0d1117"/>
    <rect x="0" y="0" width="1200" height="252" fill="none" stroke="#21262d" stroke-width="1"/>

    <!-- editor title bar -->
    <rect x="0" y="0" width="1200" height="38" fill="#161b22"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#21262d" stroke-width="1"/>
    <circle cx="30" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="19" r="6" fill="#27c93f"/>
    <text x="1164" y="24" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#8b949e">train_model.py</text>

    <!-- line number column separator -->
    <line x1="58" y1="38" x2="58" y2="252" stroke="#21262d" stroke-width="1" opacity="0.5"/>

    <!-- line numbers (appear in sync with each code line) -->
    <text x="50" y="66" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">1
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.026;0.027;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="96" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">2
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.110;0.111;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="126" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">3
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.247;0.248;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="156" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">4
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.386;0.387;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="186" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">5
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.410;0.411;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="216" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#484f58" opacity="0">6
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.594;0.595;0.919;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <!-- code lines -->
    <text x="64" y="66" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip0)"><tspan fill="#c9d1d9">model = </tspan><tspan fill="#7f9cf5">keras</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#7f9cf5">Sequential</tspan><tspan fill="#c9d1d9">([</tspan></text>

    <text x="64" y="96" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip1)"><tspan fill="#c9d1d9">    </tspan><tspan fill="#7f9cf5">keras</tspan><tspan fill="#c9d1d9">.layers.</tspan><tspan fill="#7f9cf5">Dense</tspan><tspan fill="#c9d1d9">(128, activation=</tspan><tspan fill="#e3b34f">"relu"</tspan><tspan fill="#c9d1d9">),</tspan></text>

    <text x="64" y="126" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip2)"><tspan fill="#c9d1d9">    </tspan><tspan fill="#7f9cf5">keras</tspan><tspan fill="#c9d1d9">.layers.</tspan><tspan fill="#7f9cf5">Dense</tspan><tspan fill="#c9d1d9">(10, activation=</tspan><tspan fill="#e3b34f">"softmax"</tspan><tspan fill="#c9d1d9">)</tspan></text>

    <text x="64" y="156" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip3)"><tspan fill="#c9d1d9">])</tspan></text>

    <text x="64" y="186" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip4)"><tspan fill="#7f9cf5">model</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#7f9cf5">compile</tspan><tspan fill="#c9d1d9">(optimizer=</tspan><tspan fill="#e3b34f">"adam"</tspan><tspan fill="#c9d1d9">, loss=</tspan><tspan fill="#e3b34f">"categorical_crossentropy"</tspan><tspan fill="#c9d1d9">)</tspan></text>

    <text x="64" y="216" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" clip-path="url(#clip5)"><tspan fill="#7f9cf5">model</tspan><tspan fill="#c9d1d9">.</tspan><tspan fill="#7f9cf5">fit</tspan><tspan fill="#c9d1d9">(X_train, y_train, epochs=10)</tspan></text>

    <!-- blinking cursor after last line (appears after typing finishes, disappears on reset) -->
    <rect x="408" y="202" width="2" height="14" fill="#4169E1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;0" keyTimes="0;0.692;0.693;0.739;0.785;0.831;0.877;0.919;1" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
